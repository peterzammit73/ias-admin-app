<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iAS Firestore Diagnostic v5.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 sm:p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <header class="mb-6 border-b pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Firestore Diagnostic Dashboard</h1>
                <p class="text-sm text-gray-600">Deep-Scan Audit v5.3 - Unlimited Fetch & Performance Optimized Rendering</p>
            </div>
            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded">v5.3</span>
        </header>

        <!-- Section: Configuration -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-2">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Firebase Config Object</label>
                <textarea id="config" class="w-full h-32 p-2 border rounded font-mono text-[10px] bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="const firebaseConfig = { ... };"></textarea>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-3 text-center">Global Stats</h3>
                <button id="countBtn" class="w-full bg-white border border-gray-300 text-gray-700 py-2 rounded font-semibold hover:bg-gray-100 transition mb-4 flex items-center justify-center shadow-sm">
                    <svg class="h-4 w-4 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                    Check Database Totals
                </button>
                <div id="countsResult" class="grid grid-cols-2 gap-2">
                    <div class="text-[10px] text-gray-400 italic col-span-2 text-center">Click button to load totals...</div>
                </div>
            </div>
        </div>

        <!-- Section: Targeted Audit -->
        <div class="border-t pt-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <svg class="h-5 w-5 mr-2 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                Case-Insensitive Identity Audit (Unlimited)
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Target Email Address</label>
                    <input id="email" type="email" placeholder="e.g. david.micallef@ias.com.mt" class="w-full p-2 border rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="flex items-end gap-2 md:col-span-2">
                    <button id="auditBtn" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg font-bold hover:bg-indigo-700 transition shadow-md flex items-center justify-center">
                        <span id="btnText">Run Full Identity Audit</span>
                    </button>
                    <div class="w-px h-10 bg-gray-200"></div>
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Filter by Month</label>
                        <div class="flex gap-1">
                            <input id="targetMonth" type="month" value="2019-01" class="w-full p-1.5 border rounded text-xs">
                            <button id="checkBtn" class="bg-gray-800 text-white p-2 rounded hover:bg-black" title="Scan Month">
                                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="status" class="hidden mb-4 p-3 bg-blue-50 text-blue-700 text-xs rounded border border-blue-100 italic"></div>

            <div id="results" class="space-y-6"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, Timestamp, limit, getCountFromServer } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";

        let dbInstance = null;
        let authInstance = null;

        const ensureInitialized = async () => {
            if (dbInstance && authInstance) return { db: dbInstance, auth: authInstance };
            const configText = document.getElementById('config').value.trim();
            if (!configText) throw new Error("Please provide Firebase Config.");
            let cleanConfig = configText;
            if (cleanConfig.includes('=')) cleanConfig = cleanConfig.split('=')[1].trim();
            if (cleanConfig.endsWith(';')) cleanConfig = cleanConfig.slice(0, -1);
            const config = (new Function(`return ${cleanConfig}`))();
            const app = getApps().length === 0 ? initializeApp(config) : getApps()[0];
            dbInstance = getFirestore(app);
            authInstance = getAuth(app);
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(authInstance, __initial_auth_token);
            } else {
                try { await signInAnonymously(authInstance); } catch (e) { }
            }
            return { db: dbInstance, auth: authInstance };
        };

        const logStatus = (msg) => {
            const el = document.getElementById('status');
            el.classList.remove('hidden');
            el.innerText = msg;
        };

        const getFieldType = (val) => {
            if (val === null || val === undefined) return 'NULL';
            if (val instanceof Timestamp) return 'TIMESTAMP';
            if (typeof val === 'string') return 'STRING';
            return (typeof val).toUpperCase();
        };

        const validateMaskExtended = (title) => {
            if (!title) return { valid: false, reason: "Empty Title" };
            if (title.startsWith('0999-')) {
                const isValid = /^0999-[A-Z0-9]+\/[A-Z0-9]+-[A-Za-z0-9]+(-.*)?$/i.test(title);
                return { valid: isValid, reason: isValid ? "OK" : "0999 format error" };
            }
            const standardRegex = /^\d{4}-[A-Z0-9]+\/[A-Z0-9]+-.*$/i;
            const isValid = standardRegex.test(title);
            if (isValid) return { valid: true, reason: "OK" };
            if (!/^\d{4}-/.test(title)) return { valid: false, reason: "Missing 4-digit project prefix" };
            if (!/\//.test(title)) return { valid: false, reason: "Missing Dept prefix (e.g. A/)" };
            return { valid: false, reason: "Invalid Format" };
        };

        const parseFlexibleDate = (val) => {
            if (!val) return null;
            if (val instanceof Timestamp) return val.toDate();
            if (typeof val === 'string') {
                const isoMatch = val.match(/^(\d{4})-(\d{2})-(\d{2})/);
                if (isoMatch) return new Date(val);
                const dmyMatch = val.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
                if (dmyMatch) {
                    const day = parseInt(dmyMatch[1], 10);
                    const month = parseInt(dmyMatch[2], 10) - 1;
                    let year = parseInt(dmyMatch[3], 10);
                    if (year < 100) year += 2000;
                    return new Date(year, month, day);
                }
            }
            const d = new Date(val);
            return isNaN(d.getTime()) ? null : d;
        };

        // --- GLOBAL OVERVIEW ---
        document.getElementById('countBtn').addEventListener('click', async () => {
            const targetDiv = document.getElementById('countsResult');
            targetDiv.innerHTML = '<div class="col-span-2 text-center p-2"><div class="animate-spin inline-block h-4 w-4 border-b-2 border-indigo-600 rounded-full"></div></div>';
            try {
                const { db } = await ensureInitialized();
                const collections = [{ label: 'Total Hours', path: 'timesheet_entries' }, { label: 'Employees', path: 'employees' }, { label: 'Active Projects', path: 'projects' }, { label: 'Clients', path: 'clients' }];
                let html = "";
                for (const col of collections) {
                    try {
                        const count = (await getCountFromServer(collection(db, col.path))).data().count;
                        html += `<div class="bg-white p-2 border rounded shadow-sm text-center"><p class="text-[9px] text-gray-400 font-bold uppercase">${col.label}</p><p class="text-sm font-black text-indigo-600">${count.toLocaleString()}</p></div>`;
                    } catch (e) { html += `<div class="bg-red-50 p-2 border rounded text-center"><p class="text-[8px] text-red-600">Error</p></div>`; }
                }
                targetDiv.innerHTML = html;
            } catch (e) { targetDiv.innerHTML = `<p class="col-span-2 text-[10px] text-red-500 font-bold text-center">${e.message}</p>`; }
        });

        // --- CORE AUDIT LOGIC (UNLIMITED MERGE) ---
        const runEmailAudit = async (filterMonth = null) => {
            const rawEmail = document.getElementById('email').value.trim();
            const resultsDiv = document.getElementById('results');
            if (!rawEmail) return alert("Please provide email address.");

            try {
                const { db } = await ensureInitialized();
                resultsDiv.innerHTML = `<div class="flex flex-col items-center justify-center p-12"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div><p class="text-indigo-600 font-medium">Scanning all records for "${rawEmail}"...</p><p class="text-xs text-gray-500 mt-2">Merging variants and fetching full dataset (no limits)...</p></div>`;

                // Generate variants for parallel queries
                const variants = Array.from(new Set([
                    rawEmail,
                    rawEmail.toLowerCase(),
                    rawEmail.toUpperCase(),
                    rawEmail.split('.').map(s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase()).join('.') // Proper Case
                ]));

                logStatus(`Querying variants: ${variants.join(', ')}...`);

                const queryPromises = variants.map(v => getDocs(query(collection(db, "timesheet_entries"), where("emailAddress", "==", v))));
                const snapshots = await Promise.all(queryPromises);

                // Merge documents and remove duplicates by ID
                const docMap = new Map();
                const casingStats = {};

                snapshots.forEach((snap, idx) => {
                    const variantName = variants[idx];
                    if (!snap.empty) {
                        casingStats[variantName] = snap.size;
                        snap.docs.forEach(doc => docMap.set(doc.id, doc.data()));
                    }
                });

                let timestampCount = 0;
                let stringCount = 0;
                let validFormatCount = 0;
                let invalidFormatCount = 0;

                const filteredRows = [];
                const monthBounds = filterMonth ? {
                    start: new Date(Date.UTC(filterMonth.split('-')[0], filterMonth.split('-')[1] - 1, 1)).getTime(),
                    end: new Date(Date.UTC(filterMonth.split('-')[0], filterMonth.split('-')[1], 0, 23, 59, 59)).getTime()
                } : null;

                docMap.forEach((data, id) => {
                    const rawDate = data.date;
                    const dateObj = parseFlexibleDate(rawDate);
                    const title = data.title || `${data.project}-${data.task}${data.comment ? '-' + data.comment : ''}`;
                    const maskAudit = validateMaskExtended(title);

                    const passDateFilter = !monthBounds || (dateObj && dateObj.getTime() >= monthBounds.start && dateObj.getTime() <= monthBounds.end);

                    if (passDateFilter) {
                        const dateType = getFieldType(rawDate);
                        filteredRows.push({
                            id: id,
                            data: data,
                            dateObj: dateObj,
                            dateType: dateType,
                            maskAudit: maskAudit,
                            title: title,
                            originalCasing: data.emailAddress
                        });

                        if (dateType === 'TIMESTAMP') timestampCount++; else if (dateType === 'STRING') stringCount++;
                        if (maskAudit.valid) validFormatCount++; else invalidFormatCount++;
                    }
                });

                resultsDiv.innerHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="p-4 bg-white border-l-4 border-indigo-500 rounded-lg shadow-sm">
                                <h4 class="text-[10px] font-bold text-gray-400 uppercase mb-1">Total Merged Count</h4>
                                <p class="text-3xl font-black text-indigo-700">${filteredRows.length.toLocaleString()}</p>
                                <p class="text-[9px] text-gray-500">${filterMonth ? 'Range: ' + filterMonth : 'All-time unlimited scan'}</p>
                            </div>
                            <div class="p-4 bg-white border-l-4 border-green-500 rounded-lg shadow-sm">
                                <h4 class="text-[10px] font-bold text-gray-400 uppercase mb-1">Correct Timestamps</h4>
                                <p class="text-3xl font-black text-green-600">${timestampCount.toLocaleString()}</p>
                            </div>
                            <div class="p-4 bg-white border-l-4 border-amber-500 rounded-lg shadow-sm">
                                <h4 class="text-[10px] font-bold text-gray-400 uppercase mb-1">String Errors</h4>
                                <p class="text-3xl font-black text-amber-600">${stringCount.toLocaleString()}</p>
                            </div>
                            <div class="p-4 bg-white border-l-4 border-red-500 rounded-lg shadow-sm">
                                <h4 class="text-[10px] font-bold text-gray-400 uppercase mb-1">Mask Errors</h4>
                                <p class="text-3xl font-black text-red-600">${invalidFormatCount.toLocaleString()}</p>
                            </div>
                        </div>

                        <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100 flex flex-col gap-2">
                            <div class="flex items-center gap-2">
                                 <svg class="h-4 w-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                 <p class="text-xs font-bold text-indigo-900">Breakdown by Email Casing:</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${Object.entries(casingStats).map(([v, c]) => `<span class="bg-white px-2 py-1 rounded text-[10px] border border-indigo-200 shadow-sm"><b>${v}</b>: ${c.toLocaleString()} records</span>`).join('')}
                            </div>
                        </div>

                        ${filteredRows.length > 0 ? `
                            <div class="mt-4 border rounded-lg overflow-hidden bg-white shadow-sm overflow-x-auto">
                                <table class="min-w-full text-[10px] font-mono">
                                    <thead class="bg-gray-800 text-white uppercase tracking-tighter text-[9px]">
                                        <tr>
                                            <th class="px-3 py-2 text-left">Parsed Date</th>
                                            <th class="px-3 py-2 text-left">Type</th>
                                            <th class="px-3 py-2 text-left">Stored Casing</th>
                                            <th class="px-3 py-2 text-left">Title / Code</th>
                                            <th class="px-3 py-2 text-left">Mask Status</th>
                                            <th class="px-3 py-2 text-right">Hrs</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        ${filteredRows.sort((a, b) => (b.dateObj || 0) - (a.dateObj || 0)).slice(0, 2000).map(row => `
                                            <tr class="hover:bg-indigo-50">
                                                <td class="px-3 py-2 font-bold text-gray-900">${row.dateObj ? row.dateObj.toISOString().split('T')[0] : 'Parse Error'}</td>
                                                <td class="px-3 py-2">
                                                    <span class="px-1.5 py-0.5 rounded text-[8px] font-bold ${row.dateType === 'TIMESTAMP' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}">
                                                        ${row.dateType}
                                                    </span>
                                                </td>
                                                <td class="px-3 py-2 text-indigo-600 font-medium italic">${row.originalCasing}</td>
                                                <td class="px-3 py-2 text-gray-600 truncate max-w-[150px]" title="${row.title}">${row.title}</td>
                                                <td class="px-3 py-2">
                                                    <div class="flex flex-col">
                                                        <span class="px-1.5 py-0.5 rounded text-[8px] font-bold w-fit ${row.maskAudit.valid ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                                            ${row.maskAudit.valid ? 'VALID' : 'INVALID'}
                                                        </span>
                                                        ${!row.maskAudit.valid ? `<span class="text-[7px] text-red-400 mt-0.5">${row.maskAudit.reason}</span>` : ''}
                                                    </div>
                                                </td>
                                                <td class="px-3 py-2 text-right font-bold text-gray-900">${row.data.duration}h</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                                ${filteredRows.length > 2000 ? `<div class="p-2 bg-gray-50 text-center text-gray-400 text-[9px]">Showing latest 2,000 merged records for stability. Total found: ${filteredRows.length.toLocaleString()}.</div>` : ''}
                            </div>
                        ` : ''}
                    `;
                logStatus("Unlimited audit complete.");
            } catch (e) {
                console.error(e);
                resultsDiv.innerHTML = `<div class="p-6 bg-red-50 text-red-700 rounded-lg font-mono text-xs">Error: ${e.message}</div>`;
            }
        };

        document.getElementById('auditBtn').addEventListener('click', () => runEmailAudit(null));
        document.getElementById('checkBtn').addEventListener('click', () => runEmailAudit(document.getElementById('targetMonth').value));
    </script>
</body>
</html>
